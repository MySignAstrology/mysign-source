<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="theme-color" content="#090B17">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="My Sign">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="https://mysignapp.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="https://mysignapp.com/og.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<script src="/sky.js?v=2"></script>
<link rel="stylesheet" href="/fonts/fonts.css?v=2">
<link rel="stylesheet" href="/brand.css?v=5">
<style>
.wrap{max-width:62rem;margin:0 auto;padding:0 1rem}
main{position:relative;z-index:2;padding:1.5rem 0 4rem}
header.top{position:relative;z-index:3;padding:1rem 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.cta-sm{font-size:.875rem;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.kick{font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 .6rem}
h1.hero{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.04;margin:0 0 .8rem}
h1.hero em{color:var(--accent)}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;margin:1.2rem 0 1.4rem}
.chips button{font:inherit;font-size:.8125rem;font-weight:600;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);padding:.45rem .9rem;cursor:pointer;min-height:2.4rem}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.8rem}
.couple{display:block;text-decoration:none;color:var(--ink);padding:1.1rem 1.15rem;position:relative}
.couple:hover{border-color:var(--accent)}
.couple .nm{font-family:var(--display);font-size:1.35rem;line-height:1.15;margin:0 2.8rem .35rem 0}
.couple .st{font-size:.8125rem;color:var(--ink-3);margin:0}
.couple .su{font-size:.75rem;color:var(--ink-3);margin:.45rem 0 0}
.score{position:absolute;right:1rem;top:1rem;text-align:right}
.score b{display:block;font-family:var(--head);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.band{display:inline-block;font-size:.625rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:.25rem}
.empty{color:var(--ink-3)}
.back{display:inline-block;font-size:.875rem;font-weight:600;color:var(--accent);text-decoration:none;margin-bottom:1rem}
.bigscore{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin:.2rem 0 .3rem}
.bigscore b{font-family:var(--head);font-size:clamp(3.4rem,12vw,5rem);line-height:.95;font-variant-numeric:tabular-nums}
.bigscore .band{font-size:.75rem}
.range{font-size:.875rem;color:var(--ink-3);margin:0 0 .4rem}
.status{font-size:.9375rem;color:var(--ink-2);margin:0 0 1.4rem}
.read{padding:1.3rem 1.3rem 1.1rem;margin-bottom:1rem}
.read .headline{font-family:var(--flair);font-style:italic;font-size:clamp(1.5rem,5vw,2rem);line-height:1.15;margin:0 0 .6rem;text-wrap:balance}
.read .vibe{font-size:1rem;margin:0 0 .4rem}
.read .sec{border-top:1px solid var(--rule);padding:.8rem 0 .2rem}
.read .sec h3,.panel h3{font-family:var(--head);font-style:italic;font-weight:500;font-size:1.15rem;margin:0 0 .2rem}
.read .sec p{margin:0;color:var(--ink-2);font-size:.9375rem}
.read .verdict{font-family:var(--flair);font-style:italic;font-size:1.2rem;margin:.8rem 0 0;color:var(--accent)}
.because{display:inline-block;margin-top:.45rem;font-size:.6875rem;letter-spacing:.03em;color:var(--accent);background:var(--accent-wash);border-radius:var(--r-pill);padding:.25em .7em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1rem}
@media(max-width:40rem){.two{grid-template-columns:1fr}}
.panel{padding:1.1rem 1.15rem;margin-bottom:1rem}
.panel h2{font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 .8rem}
.person h3{margin-bottom:.15rem}
.person .born{font-size:.8125rem;color:var(--ink-3);margin:0 0 .6rem}
.person dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;margin:0;font-size:.9rem}
.person dt{color:var(--ink-3)} .person dd{margin:0}
.src{font-size:.75rem;color:var(--ink-3);margin:.6rem 0 0}
.src a{color:var(--ink-3)}
.dim{margin:.55rem 0}
.dim .row{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600}
.dim .row span{color:var(--ink-3);font-weight:400}
.dim .bar{height:.4rem;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden;margin:.3rem 0 .15rem}
.dim .bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
.dim small{font-size:.75rem;color:var(--ink-3)}
.theme{border-top:1px solid var(--rule);padding:.75rem 0}
.theme:first-of-type{border-top:0;padding-top:0}
.theme .tt{font-weight:700;font-size:.95rem}
.theme .tt span{font-weight:500;color:var(--ink-3);font-size:.8125rem;margin-left:.35rem}
.ct{font-size:.875rem;margin:.35rem 0 0;color:var(--ink-2)}
.ct b{color:var(--ink);font-weight:600}
.ct small{color:var(--ink-3)}
.note{font-size:.875rem;color:var(--ink-2);margin:.4rem 0 0}
.caveat{font-size:.8125rem;color:var(--ink-3);margin:.3rem 0 0}
.story .known{font-family:var(--flair);font-style:italic;font-size:1.1rem;margin:0 0 .5rem}
.story .met{font-size:.9375rem;color:var(--ink-2);margin:0 0 .7rem}
.story ol{list-style:none;margin:0;padding:0 0 0 .9rem;border-left:2px solid var(--rule)}
.story li{position:relative;margin:0 0 .65rem;font-size:.9rem;color:var(--ink-2)}
.story li::before{content:'';position:absolute;left:-1.27rem;top:.42rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--accent)}
.story li b{display:block;color:var(--ink);font-size:.8125rem;font-weight:600}
.story li a,.story .met a{font-size:.75rem;color:var(--ink-3);margin-left:.3rem;white-space:nowrap}
.how p{font-size:.9rem;color:var(--ink-2);margin:0 0 .6rem}
.endcta{text-align:center;padding:1.6rem 1.2rem;margin-top:1.4rem}
.endcta h2{font-family:var(--head);font-weight:500;font-size:1.7rem;margin:0 0 .4rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.endcta p{color:var(--ink-2);margin:0 0 1rem}
.endcta .primary{max-width:20rem;margin:0 auto}
footer{position:relative;z-index:2;font-size:.75rem;color:var(--ink-3);padding:1rem 0 3rem}
footer a{color:var(--ink-3)}
</style>
<script src="/static/inapp.js"></script></head>
<body>
<div class="sky" aria-hidden="true"><div class="haze"></div><div class="orb"><i></i></div></div><div class="grain" aria-hidden="true"></div>
<header class="top">
  <div class="wrap">
    <a class="lockup" href="/" aria-label="My Sign, home"><span class="brand">My&nbsp;Sign</span></a>
    <a class="cta-sm" href="/app">Check your own couple →</a>
  </div>
</header>
<main><div class="wrap" id="root"></div></main>
<footer><div class="wrap">
  This is for fun. Ratings use public birth dates from <a href="https://www.wikidata.org" rel="noopener">Wikidata</a>;
  most birth times aren't public, so most scores are ranges. Nothing here is a claim about anyone's real relationship.
  · <a href="/accuracy">How accurate is the astronomy?</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
</div></footer>
<script id="data" type="application/json">{{DATA}}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var root = document.getElementById('root');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString('en-US',
      {year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'});
  }
  function because(b) { return b ? '<span class="because">' + esc(b) + '</span>' : ''; }
  function rangeText(c) {
    return c.exact ? '' : (c.range[0] === c.range[1] ? '' :
      'Between ' + c.range[0] + ' and ' + c.range[1] + ' depending on birth times we don’t know.');
  }

  /* ------------------------------------------------------------- list */
  function list() {
    var groups = D.groups, order = Object.keys(groups), active = 'all';
    root.innerHTML =
      '<p class="kick">Celebrity couple compatibility</p>' +
      '<h1 class="hero">Famous couples, <em>by the stars.</em></h1>' +
      '<p class="lede">The Obamas, Taylor and Travis, Beyoncé and Jay-Z, the Kardashians and history’s great pairs — ' +
      'scored by the same compatibility engine you get in the app, from their real birth dates. Tap any couple to see why.</p>' +
      '<div class="chips" role="group" aria-label="Filter couples">' +
      '<button type="button" data-g="all" aria-pressed="true">Everyone</button>' +
      order.map(function (g) { return '<button type="button" data-g="' + esc(g) + '" aria-pressed="false">' + esc(groups[g]) + '</button>'; }).join('') +
      '<button type="button" data-g="top" aria-pressed="false">Highest scores</button>' +
      '</div><div class="grid" id="grid"></div>' + endCta();
    function draw() {
      var xs = D.couples.slice();
      if (active === 'top') xs.sort(function (a, b) { return b.overall - a.overall; });
      else if (active !== 'all') xs = xs.filter(function (c) { return c.group === active; });
      document.getElementById('grid').innerHTML = xs.map(function (c) {
        return '<a class="couple card" href="/couples/' + esc(c.slug) + '" data-slug="' + esc(c.slug) + '">' +
          '<span class="score"><b>' + c.overall + '</b><span class="band">' + esc(c.band) + '</span></span>' +
          '<p class="nm">' + esc(c.names[0]) + ' &amp; ' + esc(c.names[1]) + '</p>' +
          '<p class="st">' + esc(c.status) + '</p>' +
          '<p class="su">' + esc(c.suns[0]) + ' Sun · ' + esc(c.suns[1]) + ' Sun</p></a>';
      }).join('') || '<p class="empty">Nobody here yet.</p>';
    }
    root.querySelector('.chips').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      active = b.dataset.g;
      root.querySelectorAll('.chips button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      draw();
    });
    draw();
  }

  /* ----------------------------------------------------------- detail */
  function person(p) {
    var s = p.signs, rows = ['Sun', 'Moon', 'Rising', 'Venus', 'Mars', 'Mercury'].filter(function (k) { return s[k]; });
    return '<div class="panel card person"><h3>' + esc(p.name) + '</h3>' +
      '<p class="born">Born ' + esc(fmtDate(p.born)) + (p.time_known ? ' at ' + esc(p.time) : '') +
      (p.place ? ', ' + esc(p.place) : '') + (p.died ? ' · died ' + esc(fmtDate(p.died)) : '') + '</p>' +
      '<dl>' + rows.map(function (k) { return '<dt>' + k + '</dt><dd>' + esc(s[k]) + '</dd>'; }).join('') + '</dl>' +
      '<p class="src">' + (p.time_known ? 'Birth time: ' + esc(p.time_source) + '. ' : 'Birth time isn’t public, so there’s no rising sign. ') +
      '<a href="' + esc(p.source) + '" rel="noopener">Birth record (Wikidata)</a></p></div>';
  }
  function readBlock(r) {
    if (!r) return '';
    return '<section class="read card" aria-label="Their reading"><p class="kick">Their reading</p>' +
      '<p class="headline">' + esc(r.headline) + '</p><p class="vibe">' + esc(r.vibe) + '</p>' +
      (r.sections || []).map(function (x) {
        return '<div class="sec"><h3>' + esc(x.title) + '</h3><p>' + esc(x.text) + '</p>' + because(x.because) + '</div>';
      }).join('') + (r.verdict ? '<p class="verdict">' + esc(r.verdict) + '</p>' : '') + '</section>';
  }
  var EVENT = {met: 'Met', 'public': 'Went public', engaged: 'Engaged', married: 'Married',
    separated: 'Separated', divorced: 'Divorced', reunited: 'Back together', widowed: 'Widowed', split: 'Split'};
  function when(d) {
    var p = d.split('-');
    if (p.length === 3) return fmtDate(d);
    if (p.length === 2) return new Date(Date.UTC(+p[0], +p[1] - 1, 1)).toLocaleDateString('en-US',
      {year: 'numeric', month: 'long', timeZone: 'UTC'});
    return p[0];
  }
  function srcLinks(urls) {
    return (urls || []).filter(function (u) { return /^https:\/\//.test(u); }).slice(0, 3).map(function (u) {
      var host = u.replace(/^https:\/\/(www\.)?/, '').split('/')[0];
      return '<a href="' + esc(u) + '" rel="nofollow noopener" target="_blank">' + esc(host) + '</a>';
    }).join('');
  }
  function storyBlock(st) {
    if (!st || !(st.milestones || []).length) return '';
    return '<section class="panel card story"><h2>Their story</h2>' +
      (st.known_as ? '<p class="known">' + esc(st.known_as) + '</p>' : '') +
      (st.met ? '<p class="met">' + esc(st.met.text) + srcLinks(st.met.sources) + '</p>' : '') +
      '<ol>' + st.milestones.map(function (m) {
        return '<li><b>' + esc(EVENT[m.event] || m.event) + ' · ' + esc(when(m.date)) + '</b>' +
          esc(m.text) + srcLinks(m.sources) + '</li>';
      }).join('') + '</ol>' +
      '<p class="caveat">These are public milestones only, each linked to where it was reported.</p></section>';
  }
  function detail() {
    var c = D.couple, b = c.breakdown;
    document.title = c.names[0] + ' & ' + c.names[1] + ' compatibility — My Sign';
    root.innerHTML =
      '<a class="back" href="/couples">← All couples</a>' +
      '<p class="kick">Celebrity couple compatibility</p>' +
      '<h1 class="hero">' + esc(c.names[0]) + ' <em>&amp;</em> ' + esc(c.names[1]) + '</h1>' +
      '<div class="bigscore"><b>' + c.overall + '</b><span>/ 100</span><span class="band">' + esc(c.band) + '</span></div>' +
      '<p class="range">' + esc(rangeText(c)) + '</p>' +
      '<p class="status">' + esc(c.status) + '</p>' +
      readBlock(c.read) +
      storyBlock(c.story) +
      '<div class="two">' + person(c.people[0]) + person(c.people[1]) + '</div>' +
      '<section class="panel card"><h2>The three numbers behind it</h2>' +
      b.dimensions.map(function (d) {
        return '<div class="dim"><div class="row">' + esc(d.key.charAt(0).toUpperCase() + d.key.slice(1)) +
          '<span>' + d.value + ' / 100</span></div><div class="bar"><i style="width:' + Math.max(2, Math.min(100, d.value)) + '%"></i></div>' +
          '<small>' + esc(d.means) + '</small></div>';
      }).join('') + '</section>' +
      '<section class="panel card"><h2>Why: theme by theme</h2>' +
      b.themes.map(function (t) {
        return '<div class="theme"><div class="tt">' + esc(t.title) + '<span>' + esc(t.presence) + (t.tone ? ', ' + esc(t.tone) : '') + '</span></div>' +
          (t.means ? '<p class="caveat">' + esc(t.means) + '</p>' : '') +
          (t.note ? '<p class="note">' + esc(t.note) + '</p>' : '') +
          t.contacts.map(function (k) {
            return '<p class="ct"><b>' + esc(k.text) + '</b> <small>' + k.orb + '° · ' + esc(k.certainty) + '</small><br>' + esc(k.meaning) + '</p>';
          }).join('') + '</div>';
      }).join('') + '</section>' +
      '<section class="panel card"><h2>The two of them blended into one chart</h2>' +
      '<p class="note"><b>Composite Sun in ' + esc(b.composite.sun_sign) + '.</b> ' + esc(b.composite.sun) + '</p>' +
      (b.composite.moon_sign ? '<p class="note"><b>Composite Moon in ' + esc(b.composite.moon_sign) + '.</b> ' + esc(b.composite.moon) + '</p>' : '') +
      '<p class="note">' + esc(b.balance.note) + '</p>' +
      b.balance.venus_mars.map(function (v) { return '<p class="note"><b>' + esc(v.text) + '.</b> ' + esc(v.note) + '</p>'; }).join('') +
      b.caveats.map(function (x) { return '<p class="caveat">' + esc(x) + '</p>'; }).join('') + '</section>' +
      '<section class="panel card how"><h2>How we score this</h2>' +
      '<p>This is the same compatibility engine you get in the app, with nothing tuned for celebrities. Birth dates and places come from Wikidata' +
      (c.sources && c.sources.retrieved ? ' (checked ' + esc(c.sources.retrieved) + ')' : '') +
      '. Relationship status is re-checked every week' + (c.sources && c.sources.status_checked ? ', last on ' + esc(c.sources.status_checked) : '') + '.</p>' +
      '<p>Most celebrities’ birth times aren’t public, so we don’t guess: the score is checked across every possible time that day, which is why you see a range. ' +
      'Where a time is documented — a birth certificate, a palace bulletin, or a birth record rated AA or A on astrology’s Rodden scale — we use it, and say so on that person’s card. ' +
      'A score of 50 is typical for any pair. A low score isn’t a verdict — plenty of couples who make it work score low.</p></section>' +
      endCta();
  }
  function endCta() {
    return '<section class="endcta card"><h2>Now check your own.</h2><p>Add your person and see the same breakdown for the two of you — from your real birth times.</p>' +
      '<a class="primary" href="/app">Check your own couple</a></section>';
  }
  if (D.view === 'detail') detail(); else list();
})();
</script>
</body>
</html>
