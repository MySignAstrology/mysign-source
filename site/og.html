<!doctype html>
<!-- Source for og.png (1200×630). Not linked from the site; regenerate with
     the snippet in site/README.md ("Share image"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Sign — share image</title>
<link rel="stylesheet" href="/fonts/fonts.css?v=2">
<style>
:root{--ink:#F3EAE2;--ink-2:#CDBDB5;--ink-3:#B4A39B;--accent:#E7A79C;--accent-2:#E6CFA8;
  --display:'Instrument Serif',Didot,Georgia,serif;--sans:'Geist','Helvetica Neue',Arial,sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60% 80% at 82% 40%, rgba(180,72,92,.42), transparent 70%),
    radial-gradient(50% 60% at 10% 110%, rgba(230,175,130,.16), transparent 70%),
    linear-gradient(180deg,#1A0F16 0%,#120B10 55%,#0F0B0D 100%)}
.stars{position:absolute;inset:0;opacity:.7;
  background-image:
    radial-gradient(1px 1px at 12% 18%,rgba(255,236,226,.7),transparent 60%),
    radial-gradient(1px 1px at 28% 72%,rgba(255,236,226,.5),transparent 60%),
    radial-gradient(1.4px 1.4px at 46% 12%,rgba(255,236,226,.6),transparent 60%),
    radial-gradient(1px 1px at 58% 88%,rgba(255,236,226,.45),transparent 60%),
    radial-gradient(1.2px 1.2px at 92% 14%,rgba(255,236,226,.6),transparent 60%),
    radial-gradient(1px 1px at 96% 78%,rgba(255,236,226,.5),transparent 60%),
    radial-gradient(1px 1px at 6% 52%,rgba(255,236,226,.45),transparent 60%),
    radial-gradient(1.3px 1.3px at 38% 40%,rgba(255,236,226,.35),transparent 60%)}
.copy{position:absolute;left:84px;top:78px;width:640px}
.lock{display:flex;align-items:center;gap:14px}
.lock svg{width:44px;height:44px}
.brand{font-family:var(--display);font-size:38px;letter-spacing:-.01em}
h1{margin-top:58px;font-family:var(--display);font-weight:400;font-size:76px;line-height:1.02;letter-spacing:-.02em}
h1 em{font-style:italic;background:linear-gradient(100deg,#F0DDBF 0%,#E7A79C 50%,#D27A86 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.eyebrow{position:absolute;left:84px;bottom:70px;font-family:var(--mono);font-size:17px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.eyebrow b{color:var(--accent-2);font-weight:500}
.orbit{position:absolute;right:-40px;top:55px;width:520px;height:520px}
.ring{fill:none;stroke:rgba(255,226,214,.22);stroke-width:.6}
.ring.faint{stroke-dasharray:1 5}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="ms-brass" x1="0" y1="0" x2=".35" y2="1">
    <stop offset="0" stop-color="#EFC97E"/><stop offset=".55" stop-color="#D9A94E"/><stop offset="1" stop-color="#B8842C"/></linearGradient>
  <linearGradient id="ms-rose" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E6CFA8"/><stop offset=".5" stop-color="#E7A79C"/><stop offset="1" stop-color="#B4485C"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#EFC97E" stop-opacity=".35"/><stop offset="1" stop-color="#EFC97E" stop-opacity="0"/></radialGradient>
  <symbol id="ms-star" viewBox="0 0 120 120"><path d="M 60 3 C 61.27 52.02, 66.86 58.52, 109 60 C 66.86 61.48, 61.27 67.98, 60 117 C 58.73 67.98, 53.14 61.48, 11 60 C 53.14 58.52, 58.73 52.02, 60 3 Z"/></symbol>
  <symbol id="ms-glint" viewBox="0 0 120 120"><path d="M 97 10 C 97.4 24.62, 99.17 26.56, 112.5 27 C 99.17 27.44, 97.4 29.38, 97 44 C 96.6 29.38, 94.83 27.44, 81.5 27 C 94.83 26.56, 96.6 24.62, 97 10 Z"/></symbol>
</defs></svg>
<div class="stars"></div>
<svg class="orbit" viewBox="0 0 240 240" aria-hidden="true">
  <circle cx="120" cy="120" r="40" fill="url(#halo)"/>
  <circle class="ring" cx="120" cy="120" r="46"/>
  <circle class="ring" cx="120" cy="120" r="70"/>
  <circle class="ring faint" cx="120" cy="120" r="94"/>
  <circle class="ring" cx="120" cy="120" r="112" opacity=".6"/>
  <circle cx="186" cy="96" r="3.4" fill="url(#ms-rose)"/>
  <circle cx="120" cy="8" r="2.2" fill="#E6CFA8"/>
  <circle cx="58" cy="157" r="1.7" fill="#E7A79C"/>
  <circle cx="54" cy="120" r="1.8" fill="#E6CFA8"/>
  <circle cx="193" cy="201" r="1.4" fill="url(#ms-rose)"/>
  <use href="#ms-star" x="94" y="94" width="52" height="52" fill="url(#ms-brass)"/>
</svg>
<div class="copy">
  <div class="lock">
    <svg viewBox="0 0 120 120"><use href="#ms-star" fill="url(#ms-brass)"/><use href="#ms-glint" fill="#EFC97E" opacity=".85"/></svg>
    <span class="brand">My Sign</span>
  </div>
  <h1>The sky, read against your own life — <em>and remembered.</em></h1>
</div>
<p class="eyebrow"><b>mysignapp.com</b> &nbsp;·&nbsp; a daily companion &nbsp;·&nbsp; checked against NASA</p>
</body>
</html>
